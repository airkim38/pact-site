<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pact - Collective Negotiation Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: #0f172a;
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .container {
      width: 100%;
      max-width: 720px;
      text-align: center;
      padding: 48px 28px;
    }
    .badge {
      display: inline-block;
      padding: 8px 14px;
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 999px;
      color: #cbd5e1;
      font-size: 13px;
      margin-bottom: 22px;
      background: rgba(255,255,255,0.03);
    }
    .logo {
      font-size: 40px;
      font-weight: 700;
      letter-spacing: 0.08em;
      margin-bottom: 18px;
    }
    h1 {
      margin: 0 0 16px;
      font-size: 44px;
      line-height: 1.15;
    }
    p {
      margin: 0 auto 32px;
      max-width: 620px;
      color: #94a3b8;
      font-size: 18px;
      line-height: 1.7;
    }
    .form {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }
    input[type="email"] {
      width: 340px;
      max-width: 100%;
      padding: 15px 16px;
      border: 1px solid #334155;
      border-radius: 10px;
      background: #111827;
      color: white;
      outline: none;
      font-size: 15px;
    }
    button {
      padding: 15px 20px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
    }
    button:hover {
      background: #1d4ed8;
    }
    .sub {
      font-size: 13px;
      color: #64748b;
      margin-top: 10px;
    }
    .footer {
      margin-top: 42px;
      font-size: 13px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="badge">Launching Soon</div>
    <div class="logo">PACT</div>
    <h1>Negotiate Better. Together.</h1>
    <p>
      A collective negotiation platform designed to help people organize, align,
      and move with clarity.
    </p>

    <div class="form">
      <input type="email" placeholder="Enter your email" />
      <button>Notify Me</button>
    </div>

    <div class="sub">Early access opening soon.</div>
    <div class="footer">© 2026 Pact. All rights reserved.</div>
  </div>
</body>
</html>
