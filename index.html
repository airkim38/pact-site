<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PACT</title>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">

<style>

body{
background:#131A1C;
color:white;
font-family:'Outfit',sans-serif;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.container{
text-align:center;
max-width:700px;
padding:40px;
}

.logo{
font-size:120px;
font-weight:900;
letter-spacing:-6px;
line-height:1;
}

.pa{color:#80B0F8;}
.ct{color:#F87888;}

.tagline{
margin-top:10px;
letter-spacing:4px;
font-size:13px;
color:rgba(255,255,255,0.4);
}

.headline{
margin-top:40px;
font-size:42px;
font-weight:800;
}

.sub{
margin-top:16px;
color:rgba(255,255,255,0.5);
line-height:1.6;
}

.email{
margin-top:40px;
display:flex;
justify-content:center;
gap:10px;
}

input{
padding:14px 16px;
width:260px;
border-radius:8px;
border:1px solid rgba(255,255,255,0.1);
background:#1A2224;
color:white;
}

button{
padding:14px 22px;
border:none;
border-radius:8px;
background:#80B0F8;
color:#131A1C;
font-weight:700;
cursor:pointer;
}

button:hover{
opacity:.9;
}

.footer{
margin-top:60px;
font-size:12px;
color:rgba(255,255,255,0.3);
}

</style>
</head>

<body>

<div class="container">

<div class="logo">
<span class="pa">pa</span><span class="ct">ct</span>
</div>

<div class="tagline">
COLLECTIVE NEGOTIATION PLATFORM
</div>

<div class="headline">
Negotiate Better.<br>
Together.
</div>

<div class="sub">
Organize people, align interests,<br>
and move negotiations forward.
</div>

<div class="email">
<input placeholder="Enter your email">
<button>Join Waitlist</button>
</div>

<div class="footer">
© 2026 PACT
</div>

</div>

</body>
</html>
